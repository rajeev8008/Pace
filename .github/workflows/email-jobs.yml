name: Run email jobs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: email-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Process due reminders and summaries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >-
          curl --fail --retry 2 --max-time 180 -X POST
          -H "Authorization: Bearer $CRON_SECRET"
          https://pace-rajeev8008.onrender.com/internal/run-jobs
