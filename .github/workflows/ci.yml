name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dayflow
          POSTGRES_USER: dayflow
          POSTGRES_PASSWORD: dayflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayflow -d dayflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dayflow:dayflow@localhost:5432/dayflow
      SMTP_HOST: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m compileall -q app messaging scheduler worker tests
      - run: python -m tests.test_phase1
      - run: python -m tests.test_preferences
      - run: python -m tests.test_background
      - run: python -m tests.test_daily_tasks
